name: Build y publicar exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Generar los ejecutables
        shell: pwsh
        run: .\build.ps1

      - name: Publicar en la Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/conversor.exe
            dist/conversor-cli.exe

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Generar los ejecutables
        run: bash build.sh

      - name: Comprimir conversor.app
        run: ditto -c -k --sequesterRsrc --keepParent dist/conversor.app dist/conversor-mac.zip

      - name: Publicar en la Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/conversor-mac.zip
            dist/conversor-cli
