name: Build y publicar exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Generar los ejecutables
        shell: pwsh
        run: .\build.ps1

      - name: Publicar en la Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/conversor.exe
            dist/conversor-cli.exe
