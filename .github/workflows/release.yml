name: Build y publicar exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias
        run: uv sync --dev

      - name: Generar conversor.exe (interfaz grafica)
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path "assets\icon.ico") { $iconArgs = @("--icon", "assets\icon.ico") }
          uv run pyinstaller --onefile --windowed --name conversor `
            --collect-all markitdown --collect-all magika `
            --add-data "assets;assets" `
            @iconArgs `
            gui_main.py

      - name: Generar conversor-cli.exe (consola)
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path "assets\icon.ico") { $iconArgs = @("--icon", "assets\icon.ico") }
          uv run pyinstaller --onefile --console --name conversor-cli `
            --collect-all markitdown --collect-all magika `
            @iconArgs `
            main.py

      - name: Publicar en la Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/conversor.exe
            dist/conversor-cli.exe
